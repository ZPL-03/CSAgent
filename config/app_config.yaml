project:
  name: CSAgent
  display_name: CSAgent 多智能体智能设计平台
  package_name: CSDM_cph
  domain: composite_pressure_hull
  timezone: Asia/Shanghai
  default_language: zh-CN

paths:
  data_dir: data
  io_dir: data/io
  results_dir: data/results
  cases_dir: data/cases
  abaqus_runs_dir: data/abaqus_runs
  knowledge_dir: knowledge
  chroma_dir: knowledge/chroma_db
  case_library_dir: knowledge/case_library
  models_dir: models

abaqus:
  command: abaqus
  cae_args: "cae noGUI="
  python_args: "python"
  max_retries: 3
  job_timeout_seconds: 3600
  poll_interval_seconds: 5
  user_subroutine: reference/zhangusdfld.for
  use_user_subroutine: false
  cleanup_patterns:
    - "*.lck"
    - "*.023"
    - "*.com"

pipeline:
  candidate_source_ratio:
    llm: 2
    case_transfer: 1
    doe: 1
  min_case_records_for_retrain: 30
  random_seed: 42
  screening_score:
    pressure_weight: 1.0
    weight_penalty: 0.12
    uncertainty_penalty: 0.2

rag:
  embedding_model: BAAI/bge-m3
  embedding_cache_dir: models/embedding_cache
  local_files_only: true
  use_hash_embedding_only: false
  allow_hash_fallback: false

case_memory:
  collection_name: csdm_cph_case_memory
  hybrid_retrieval: true
  vector_top_k_multiplier: 4
  vector_rank_weight: 0.1

project_knowledge:
  enabled: true
  builtin_dir: knowledge/csllm
  builtin_rag_chunks_path: knowledge/csllm/rag/rag_chunks.compact.jsonl.gz
  builtin_kg_dir: knowledge/csllm/kg
  builtin_manifest_path: knowledge/csllm/provenance/manifest.json
  base_dir: knowledge/runtime
  upload_dir: knowledge/runtime/uploads
  rag_chunks_path: knowledge/runtime/rag/rag_chunks.jsonl
  kg_dir: knowledge/runtime/kg
  manifest_path: knowledge/runtime/manifest.json
  structured_dir: knowledge/runtime/structured_text
  top_k: 5
  kg_top_k: 8
  max_snippet_chars: 1200
  chunk_token_size: 512
  chunk_overlap_tokens: 64
  min_chunk_tokens: 80
  vector_enabled: true
  vector_chroma_dir: knowledge/chroma_db
  vector_collection_name: csdm_cph_project_knowledge
  vector_top_k_multiplier: 2

conversation:
  confirmation_steps:
    - screen_candidates
    - fem_evaluation
    - export_report

report:
  output_markdown: data/results/latest_report.md
  output_pdf: data/results/latest_report.pdf
